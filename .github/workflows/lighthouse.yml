name: Lighthouse + Deploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to audit'
        required: false
        default: 'https://joshbarteaux.com/'

jobs:
  lighthouse-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Lighthouse (3 runs)
        run: |
          mkdir -p reports
          TARGET_URL="${{ inputs.target_url || 'https://joshbarteaux.com/' }}"
          for i in 1 2 3; do
            npx lighthouse "$TARGET_URL" \
              --output=json \
              --output-path=reports/lh-$i.json \
              --preset=perf \
              --form-factor=mobile \
              --chrome-path="$(which google-chrome)" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet
          done

      - name: Update QuarterMaster dashboard
        run: |
          node scripts/update-quartermaster.mjs \
            --reportsDir=reports \
            --url="${{ inputs.target_url || 'https://joshbarteaux.com/' }}" \
            --device="Mobile (Lighthouse default throttling)" \
            --runs=3 \
            --notes="CI run on GitHub Actions using Lighthouse CLI."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run pytest
        run: |
          python -m pip install -r requirements-dev.txt
          pytest --junitxml=reports/pytest.xml || true

      - name: Update Test dashboard
        run: node scripts/update-test-dashboard.mjs

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/*.json
